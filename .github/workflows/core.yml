name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p seeqora-core --all-targets
      - run: cargo test -p seeqora-core

  ios:
    name: ios (simulator build)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-ios.sh
      - name: xcodebuild (unsigned, simulator)
        run: |
          xcodebuild -project ios/Seeqora.xcodeproj -scheme Seeqora \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: bash scripts/build-android.sh
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: seeqora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
