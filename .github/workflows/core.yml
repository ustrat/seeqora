name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p seeqora-core --all-targets
      - run: cargo test -p seeqora-core

  ios:
    name: ios (simulator build)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-ios.sh
      - name: xcodebuild (unsigned, simulator)
        run: |
          xcodebuild -project ios/Seeqora.xcodeproj -scheme Seeqora \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: bash scripts/build-android.sh
      - uses: actions/cache@v4
        with:
          path: models
          key: embed-models-${{ hashFiles('eval/models.json') }}
      - name: Bundle embedding model
        run: bash scripts/bundle-model.sh android/app/src/main/assets/models/bge-small-en-v1.5
      - name: Bundle answer-model tokenizer
        run: bash scripts/bundle-answer-tokenizer.sh android/app/src/main/assets/models/qwen2.5
      - name: Sideload signing key
        env:
          KEYSTORE_B64: ${{ secrets.SEEQORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "SEEQORA_KEYSTORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: building with the runner's debug key"
          fi
      - run: gradle -p android assembleDebug --no-daemon
        env:
          SEEQORA_KEYSTORE_PASSWORD: ${{ secrets.SEEQORA_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: seeqora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
