name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p seeqora-core --all-targets
      - run: cargo test -p seeqora-core
