[package]
name = "uniffi-bindgen"
description = "Generates Swift and Kotlin bindings for seeqora-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
# Must match the uniffi version in core/Cargo.toml.
uniffi = { version = "0.28", features = ["cli"] }
