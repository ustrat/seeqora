[package]
name = "seeqora-core"
description = "Seeqora shared core: ingest, chunk, embed, index, retrieve, prompt assembly"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "seeqora_core"
# staticlib -> iOS XCFramework; cdylib -> Android .so and binding generation.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.28"
# Bundled SQLite includes FTS5 and JSON1. sqlite-vec is added in Phase 0 W4.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
